name: Validate site metadata

on: pull_request

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install favicon test dependencies
        run: python3 -m pip install -r .github/scripts/requirements-icons.txt
      - name: Check JSON-LD and sitemap
        run: python3 .github/scripts/validate_site.py
      - name: Check API generation, pagination and favicon downloads
        run: |
          python3 .github/scripts/build_api.py
          python3 .github/scripts/build_directory.py
          python3 -m unittest discover -s .github/tests -p 'test_*.py'

  directory-browser:
    name: Check directory in Chromium
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/browser-tests
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - name: Build website and API
        run: python3 ../scripts/build_api.py
      - run: npx playwright install --with-deps chromium
      - run: npm test
