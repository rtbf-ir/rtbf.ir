name: Generate API and icons

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pages: write
    outputs:
      pages_mode: ${{ steps.pages.outputs.mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install favicon image support
        run: python3 -m pip install -r .github/scripts/requirements-icons.txt
      - name: Generate, validate and push API and icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            base=$(git rev-parse FETCH_HEAD)
            # This checkout contains only CI output. Rebuild from the latest
            # sources so an older API snapshot cannot overwrite newer data.
            git reset --hard "$base"

            python3 .github/scripts/download_icons.py --timeout 10 --workers 8
            python3 .github/scripts/build_api.py
            python3 .github/scripts/build_directory.py
            python3 -m unittest discover -s .github/tests -p 'test_*.py'
            python3 .github/scripts/validate_site.py

            git add --all -- api/v1 assets/img/icons directory.html
            if git diff --cached --quiet; then
              git fetch --no-tags origin main
              if [ "$(git rev-parse FETCH_HEAD)" = "$base" ]; then
                echo "Generated files are already up to date."
                exit 0
              fi
            else
              git commit -m 'update generated api and icons'
              if git push origin HEAD:main; then
                exit 0
              fi
              git fetch --no-tags origin main
              if [ "$(git rev-parse FETCH_HEAD)" = "$base" ]; then
                echo "::error::Could not push generated files even though main did not advance."
                exit 1
              fi
            fi

            echo "main advanced during generation (attempt $attempt of 3)."
          done

          echo "::error::main advanced during all three generation attempts."
          exit 1
      - name: Read Pages publishing mode
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '"mode=" + (.build_type // "legacy")' >> "$GITHUB_OUTPUT"
      - name: Rebuild branch-based Pages after the generated commit
        if: steps.pages.outputs.mode == 'legacy'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.mode == 'workflow'
        with:
          path: .

  deploy:
    needs: generate
    if: needs.generate.outputs.pages_mode == 'workflow'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish generated API and website
        id: deployment
        uses: actions/deploy-pages@v5
