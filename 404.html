<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>صفحه پیدا نشد (۴۰۴) | حق فراموش شدن</title>
    <link rel="icon" href="/assets/img/favicon.png" sizes="32x32">
    <style>
      @font-face {
        font-family: Vazir;
        src: url("/assets/font/vazir.ttf") format("truetype");
        font-display: swap;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f7f6;
        color: #262626;
        font-family: Vazir, Tahoma, sans-serif;
        line-height: 1.8;
      }

      main {
        width: min(32rem, calc(100% - 2rem));
        box-sizing: border-box;
        padding: clamp(1.25rem, 5vw, 3rem);
        border: 1px solid #dbe3dd;
        border-radius: 0.75rem;
        background: #fff;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.35rem, 4vw, 2rem);
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
        margin-top: 1.5rem;
      }

      nav a {
        padding: 0.45rem 0.9rem;
        border: 1px solid #146c43;
        border-radius: 0.4rem;
        color: #146c43;
      }

      nav a:first-child {
        background: #146c43;
        color: #fff;
      }

      nav a:focus-visible {
        outline: 2px solid #146c43;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>صفحه پیدا نشد (۴۰۴)</h1>
      <p>این نشانی ممکن است اشتباه باشد یا صفحه جابه‌جا شده باشد.</p>
      <nav aria-label="مسیرهای دسترسی">
        <a href="/">صفحهٔ اصلی</a>
        <a href="/directory">دایرکتوری حذف حساب</a>
      </nav>
    </main>
  </body>
</html>
