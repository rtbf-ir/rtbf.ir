<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>صفحه پیدا نشد (۴۰۴) | حق فراموش شدن</title>
    <link rel="icon" href="/assets/img/favicon.png" sizes="32x32">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8f9fa;
        color: #2f2f2f;
        line-height: 1.8;
      }

      main {
        width: min(32rem, calc(100% - 2rem));
        box-sizing: border-box;
        padding: clamp(1.25rem, 5vw, 3rem);
        border: 1px solid #dee2e6;
        border-top: 0.4rem solid #ffe43c;
        border-radius: 10px;
        background: #fff;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.35rem, 4vw, 2rem);
      }

      main p {
        text-align: center;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
        margin-top: 1.5rem;
      }

      nav a {
        padding: 0.45rem 0.9rem;
        border: 1px solid #2f2f2f;
        border-radius: 0.4rem;
        color: #2f2f2f;
        text-decoration: none;
      }

      nav a:first-child {
        background: #ffe43c;
        border-color: #ffe43c;
        color: #2f2f2f;
      }

      nav a:hover {
        background: #2f2f2f;
        border-color: #2f2f2f;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>صفحه پیدا نشد (۴۰۴)</h1>
      <p>این نشانی ممکن است اشتباه باشد یا صفحه جابه‌جا شده باشد.</p>
      <nav aria-label="مسیرهای دسترسی">
        <a href="/">صفحهٔ اصلی</a>
        <a href="/directory">دایرکتوری حذف حساب</a>
      </nav>
    </main>
  </body>
</html>
